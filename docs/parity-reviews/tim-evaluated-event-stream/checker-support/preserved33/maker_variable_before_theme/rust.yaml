    source: "@startuml\n\n\n\nskinparam backgroundColor transparent\nskinparam useBetaStyle false\n\n\n\n\n\n\n<style>\n  root {\n    BackgroundColor transparent\n    FontColor #fff\n    HyperLinkColor #e95420\n    LineColor #d24c1d\n    LineThickness 1\n    Margin 10\n    Padding 6\n    Shadowing 0.0\n  }\n  node {\n   Padding 15\n   roundcorner 20\n   BackgroundColor #e95420-#d24c1d\n  }\n  caption {\n    LineThickness 0\n  }\n  footer {\n    LineThickness 0\n  }\n  groupHeader {\n    BackgroundColor #aea79f\n    FontColor #17a2b8\n    FontStyle bold\n  }\n  header {\n    LineThickness 0\n  }\n  referenceHeader {\n    BackgroundColor transparent\n    FontColor #772953\n    FontStyle bold\n  }\n  separator {\n    BackgroundColor #fff\n    FontColor transparent\n    FontStyle bold\n  }\n  title {\n\tFontSize 20\n\tBorderRoundCorner            8\n\tBorderThickness \t         1\n\tBackgroundColor  #b6b0a9-#aea79f\n\tFontColor #e95420\n\tBorderColor #aea79f\n  }\n  nwdiagDiagram {\n\tnetwork {\n\t\t\tFontColor #fff\n\tBorderColor #d24c1d\n\tBackgroundColor #e95420    \n\t\tLineColor #e95420\n\t\tLineThickness 1.0\n\t\tFontColor #d24c1d\n\t}\n\tserver {\n\t\t\tFontColor #fff\n\tBorderColor #d24c1d\n\tBackgroundColor #e95420\n\t}\n\tarrow {\n\t\tFontColor #d24c1d\n\t\tLineColor #d24c1d\n\t}\n\tgroup {\n\t\tBackGroundColor #e9ecef\n\t\tLineColor #d2d4d7\n\t\tLineThickness 2.0\n\t\tMargin 5\n\t\tPadding 5\n\t}\n  }\n  ganttDiagram {\n\ttask {\n\t\t\tFontColor #fff\n\tBorderColor #d24c1d\n\tBackgroundColor #e95420\n\t\tLineColor #e95420\n\t\tMargin 10 2 2 2\n\t\tPadding 6\n\t}\n\tnote {\n\t\tFontColor #fff\n\t\tLineColor #1592a6\n\t\tBackGroundColor #17a2b8\n\t}\n\tseparator {\n\t\tLineColor #aea79f\n\t\tBackGroundColor #aea79f-#9d968f\n\t\tFontColor #fff\n\t}\n\tmilestone {\n\t\tFontColor #17a2b8\n\t\tFontSize 16\n\t\tFontStyle italic\n\t\tBackGroundColor #aea79f\n\t\tLineColor #9d968f\n\t}\n\ttimeline {\n\t\tBackgroundColor #aea79f\n\t\tFontColor #fff\n\t}\n\tclosed {\n\t\tBackgroundColor #d7a538\n\t\tFontColor #fff\n\t}\n  }\n</style>\nskinparam defaultFontName       \"Verdana\"\nskinparam defaultFontSize       12\nskinparam dpi                   100\nskinparam shadowing             false\nskinparam roundcorner           8\nskinparam ParticipantPadding    40\nskinparam BoxPadding            40\nskinparam Padding               5\nskinparam ArrowColor            #772953\nskinparam stereotype {\n    CBackgroundColor #b6b0a9\n    CBorderColor #9d968f\n    ABackgroundColor #4cbc5c\n    ABorderColor #32a243\n    IBackgroundColor #e24c41\n    IBorderColor #c93228\n    EBackgroundColor #f1be51\n    EBorderColor #d7a538\n    NBackgroundColor #2eabbf\n    NBorderColor #1592a6\n}\nskinparam title {\n\tFontColor\t                 #e95420\n\tBorderColor\t                 #9d968f\n\tFontSize\t    \t         20\n\tBorderRoundCorner            8\n\tBorderThickness \t         1\n\tBackgroundColor              #b6b0a9-#aea79f\n}\n\nskinparam legend {\n\tBackgroundColor #aea79f\n\tBorderColor #9d968f\n\tFontColor #e9ecef\n}\n\nskinparam swimlane {\n\tBorderColor #17a2b8\n\tBorderThickness 2\n\tTitleBackgroundColor  #b6b0a9-#aea79f\n\tTitleFontColor #e95420\n}\n\n\nskinparam activity {\n\t\tFontColor #fff\n\tBorderColor #d24c1d\n\tBackgroundColor #e95420\n\tBarColor #38b44a\n\tStartColor #17a2b8\n\tEndColor #17a2b8\n\tDiamondBackgroundColor #b6b0a9\n  \tDiamondBorderColor #9d968f\n  \tDiamondFontColor #fff\n}\n\n\nskinparam participant {\n\t\tFontColor #fff\n\tBorderColor #d24c1d\n\tBackgroundColor #e95420\n\tParticipantBorderThickness 2\n}\n\n\nskinparam actor {\n\t\tFontColor #fff\n\tBorderColor #d24c1d\n\tBackgroundColor #e95420\n}\n\n\nskinparam arrow {\n\tThickness 3\n\tColor #e95420\n\tFontColor #fff\n}\n\n\nskinparam sequence {\n\tBorderColor #e95420\n\tTitleFontColor #e95420\n\tBackgroundColor transparent\n\tStartColor #e95420\n\tEndColor #e95420\n\tBoxBackgroundColor transparent\n\tBoxBorderColor #772953\n\tBoxFontColor #772953\n\tDelayFontColor #772953\n\tLifeLineBorderColor #aea79f\n\tLifeLineBorderThickness 2\n\tLifeLineBackgroundColor #9d968f\n\tGroupBorderColor #772953\n\tGroupFontColor #772953\n\tGroupHeaderFontColor #17a2b8\n\tGroupBackgroundColor #aea79f\n\tGroupHeaderBackgroundColor transparent\n\tDividerBackgroundColor #772953\n    DividerBorderColor #772953\n    DividerBorderThickness 2\n    DividerFontColor #e9ecef\n\tReferenceBackgroundColor transparent\n\tReferenceBorderColor #772953\n\tReferenceFontColor #772953\n\tReferenceHeaderFontColor #17a2b8\n\tReferenceHeaderBackgroundColor #aea79f\n\tStereotypeFontColor #fff\n}\n\n\nskinparam partition {\n\tBorderColor #e95420\n\tFontColor #e95420\n\tBackgroundColor transparent\n}\n\n\nskinparam collections {\n\t\tFontColor #fff\n\tBorderColor #d24c1d\n\tBackgroundColor #e95420\n}\n\n\nskinparam control {\n\t\tFontColor #fff\n\tBorderColor #d24c1d\n\tBackgroundColor #e95420\n}\n\n\nskinparam entity {\n\t\tFontColor #fff\n\tBorderColor #d24c1d\n\tBackgroundColor #e95420\n}\n\n\nskinparam boundary {\n\t\tFontColor #fff\n\tBorderColor #d24c1d\n\tBackgroundColor #e95420\n}\n\n\nskinparam agent {\n\tBackgroundColor #efb73e\n\tBorderColor #f1be51\n\tFontColor #772953\n}\n\n\nskinparam note {\n\tBorderThickness 1\n\tBackgroundColor #17a2b8\n\tBorderColor #1592a6\n\tFontColor #fff\n}\n\n\nskinparam artifact {\n\tBackgroundColor #772953\n\tBorderColor #6b254b\n\tFontColor #e9ecef\n}\n\n\nskinparam component {\n\t\tFontColor #fff\n\tBorderColor #d24c1d\n\tBackgroundColor #e95420\n}\n\n\nskinparam interface {\n\tBackgroundColor  #c93228\n\tBorderColor  #df382c\n\tFontColor #772953\n}\n\n\nskinparam storage {\n\tBackgroundColor #efb73e\n  \tBorderColor #d7a538\n\tFontColor #fff\n}\n\n\nskinparam node {\n\tBackgroundColor  #aea79f\n\tBorderColor #e9ecef\n\tFontColor #e9ecef\n}\n\n\nskinparam cloud {\n\tBackgroundColor #F2FCFE-#eeeeee\n\tBorderColor #F2FCFE\n\tFontColor #772953\n}\n\n\nskinparam database {\n\t\tFontColor #fff\n\tBorderColor #d24c1d\n\tBackgroundColor #e95420\n}\n\n\nskinparam class {\n\t\tFontColor #fff\n\tBorderColor #d24c1d\n\tBackgroundColor #e95420\n\tHeaderBackgroundColor #eb6536\n\tStereotypeFontColor #772953\n\tBorderThickness 1\n\tAttributeFontColor #772953\n\tAttributeFontSize 11\n}\n\n\nskinparam object {\n\t\tFontColor #fff\n\tBorderColor #d24c1d\n\tBackgroundColor #e95420\n\tStereotypeFontColor #772953\n\tBorderThickness 1\n\tAttributeFontColor #fff\n\tAttributeFontSize 11\n}\n\n\nskinparam usecase {\n\t\tFontColor #fff\n\tBorderColor #d24c1d\n\tBackgroundColor #e95420\n\tBorderThickness 2\n\tStereotypeFontColor #e95420\n}\n\n\nskinparam rectangle {\n\t\tFontColor #fff\n\tBorderColor #d24c1d\n\tBackgroundColor #e95420\n\tBackgroundColor #b6b0a9\n\tBorderThickness 2\n\tStereotypeFontColor #e95420\n}\n\n\nskinparam package {\n\tBackgroundColor #aea79f\n  \tBorderColor #e95420\n\tFontColor #e95420\n\tBorderThickness 2\n}\n\n\nskinparam folder {\n\tBackgroundColor #b6b0a9\n  \tBorderColor #efb73e\n\tFontColor #efb73e\n\tBorderThickness 2\n}\n\n\nskinparam frame {\n\tBackgroundColor #b6b0a9\n  \tBorderColor #17a2b8\n\tFontColor #17a2b8\n\tBorderThickness 2\n}\n\n\nskinparam state {\n\t\tFontColor #fff\n\tBorderColor #d24c1d\n\tBackgroundColor #e95420\n\tBackgroundColor #eb6536\n\tStartColor #17a2b8\n\tEndColor #17a2b8\n\tAttributeFontColor #fff\n\tAttributeFontSize 11\n}\n\n\nskinparam queue {\n\t\tFontColor #fff\n\tBorderColor #d24c1d\n\tBackgroundColor #e95420\n}\n\n\nskinparam card {\n\tBackgroundColor #17a2b8\n\tBorderColor #1592a6\n\tFontColor #fff\n}\n\n\nskinparam file {\n\tBackgroundColor #9d968f\n\tBorderColor #e9ecef\n\tFontColor #e9ecef\n}\n\n\nskinparam stack {\n\t\tFontColor #fff\n\tBorderColor #d24c1d\n\tBackgroundColor #e95420\n}\nclass AsterCollection {\n  +length: int\n}\n@enduml\n"
