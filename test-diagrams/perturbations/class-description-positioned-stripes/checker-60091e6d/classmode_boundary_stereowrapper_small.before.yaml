      @startuml
      allowmixing
      <style>
      boundary {
       FontSize 17
       FontStyle bold
       stereotype {
       FontSize 26
       FontStyle plain
       FontColor DarkRed
       }
      }
      </style>
      boundary "<size:6>i</size>\n<size:25>Wide label</size>" as Orb <<s>>
      class Dock
      Dock -down-> Orb
      @enduml
