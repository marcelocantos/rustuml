  T14.13:
    name: Shared Creole stripe preprocessing (headings, horizontal rules, list prefixes) matches Java across every consumer
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - One shared stripe classifier, traced by source to `CreoleStripeSimpleParser` and `StripeSimple`, runs before shared command parsing for every Creole consumer. No sequence-only or family-only marker stripping remains.
    - '`ind78_stripe_heading_legacy/teoz` and the four original delimiter controls (empty `----`, five hyphens, leading `**` list, `**A…`) match pinned Java whole-output. So do at least three held-out inputs outside the golden corpus, covering heading levels 1–4, a horizontal rule and a list, in at least two diagram families.'
    - No previously passing no-oracle or standing case is lost. Note and divider consumers are either covered by the same classifier with evidence, or recorded as explicit residual failures.
    context: |-
      Java's `CreoleStripeSimpleParser` constructor classifies each line before shared command parsing:
      - horizontal-rule and section patterns (`SECTION_HEADER ^--([^-]*)--$`) come first
      - then equals-sign headings: group 2 is trimmed, and `StripeSimple#fontConfigurationForHeading` applies +4 bold, +2 bold, +1 bold or italic, depending on level
      - `ASTERISK_PREFIXED_LINE` turns `**…` into list stripes

      Rust has no shared implementation of this. Sequence labels paint the literal heading markers (`ind78_stripe_heading` in legacy and Teoz). Sequence `whole_strike_label_inner` handles `----` differently, and list preprocessing is missing, which is why all four original delimiter controls fail. On 2026-11-05 the sequence maker (account `docs/parity-reviews/sequence-heading-shared-stripe-handoff/account.json`) and the style/WBS maker both identified this as shared Creole semantics, not per-family label preprocessing, and both set it aside instead of fitting family-local marker removal.
