    source: "@startuml\n\nskinparam BackgroundColor transparent\nskinparam useBetaStyle false\n    !assume transparent light\nskinparam defaultFontName       \"Verdana\"\nskinparam defaultFontSize       12\nskinparam dpi                   100\nskinparam shadowing             false\nskinparam roundcorner           8\nskinparam ParticipantPadding    40\nskinparam BoxPadding            40\nskinparam Padding               5\nskinparam ArrowColor            #4E5D6C\nskinparam stereotype {\n    CBackgroundColor ffffff\n    CBorderColor #BEBEBE\n    ABackgroundColor #239B02\n    ABorderColor #176702\n    IBackgroundColor #EC4624\n    IBorderColor #A7280E\n    EBackgroundColor #F18E3E\n    EBorderColor #BD5B0E\n    NBackgroundColor #008AE0\n    NBorderColor #005C96\n}\nskinparam title {\n\tFontSize\t    \t         20\n\tBorderRoundCorner            8\n\tBorderThickness \t         1\n\tBackgroundColor  ffffff-#eeeeee\n\tFontColor #EC7211\n\tBorderColor #eeeeee\n}\n\nskinparam legend {\n    \t\tFontColor #4E5D6C\n\t\tBorderColor #BEBEBE\n\t\tBackgroundColor ffffff-#eeeeee\n    BackgroundColor transparent\n}\n\nskinparam swimlane {\n\tBorderColor #0073bb\n\tBorderThickness 2\n\tTitleBackgroundColor  ffffff-#eeeeee\n\tTitleFontColor #EC7211\n}\n\n\nskinparam activity {\n\t\t\tFontColor #FFF\n\t\tBorderColor #EC7211\n\t\tBackgroundColor #F18E3E-#EC7211\n\tBarColor #1D8102\n\tStartColor #0073bb\n\tEndColor #0073bb\n\tDiamondBackgroundColor #eeeeee\n  \tDiamondBorderColor #BEBEBE\n  \tDiamondFontColor #4E5D6C\n}\n\nskinparam participant {\n\t\t\tFontColor #FFF\n\t\tBorderColor #EC7211\n\t\tBackgroundColor #F18E3E-#EC7211\n\tParticipantBorderThickness 2\n}\n\nskinparam actor {\n\t\t\tFontColor #FFF\n\t\tBorderColor #EC7211\n\t\tBackgroundColor #F18E3E-#EC7211\n\tFontColor #4E5D6C\n}\n\nskinparam arrow {\n\tThickness 3\n\tColor #EC7211\n\tFontColor #4E5D6C\n}\n\nskinparam sequence {\n\tArrowThickness 3\n\tBorderColor #EC7211\n\tTitleFontColor #EC7211\n\tBackgroundColor transparent\n\tStartColor #EC7211\n\tEndColor #EC7211\n\tBoxBackgroundColor transparent\n\tBoxBorderColor #4E5D6C\n\tBoxFontColor #4E5D6C\n\tDelayFontColor #4E5D6C\n\tLifeLineBorderColor #abb6c2\n\tLifeLineBorderThickness 2\n\tLifeLineBackgroundColor #8191A3\n\tGroupBorderColor #4E5D6C\n\tGroupFontColor #4E5D6C\n\tGroupHeaderFontColor #0073bb\n\tGroupBackgroundColor #eeeeee\n\tGroupBodyBackgroundColor transparent\n\tGroupHeaderBackgroundColor transparent\n\tDividerBackgroundColor #4E5D6C\n    DividerBorderColor #4E5D6C\n    DividerBorderThickness 2\n    DividerFontColor #abb6c2\n\tReferenceBackgroundColor transparent\n\tReferenceBorderColor #4E5D6C\n\tReferenceFontColor #4E5D6C\n\tReferenceHeaderFontColor #0073bb\n\tReferenceHeaderBackgroundColor #eeeeee\n\tStereotypeFontColor #FFF\n\tStereotypeFontSize 12\n}\n\nskinparam partition {\n\tBorderColor #EC7211\n\tFontColor #EC7211\n\tBackgroundColor transparent\n}\n\nskinparam collections {\n\t\t\tFontColor #FFF\n\t\tBorderColor #EC7211\n\t\tBackgroundColor #F18E3E-#EC7211\n}\n\nskinparam control {\n\t\t\tFontColor #FFF\n\t\tBorderColor #EC7211\n\t\tBackgroundColor #F18E3E-#EC7211\n\tFontColor #4E5D6C\n}\n\nskinparam entity {\n\t\t\tFontColor #FFF\n\t\tBorderColor #EC7211\n\t\tBackgroundColor #F18E3E-#EC7211\n\tFontColor #4E5D6C\n}\n\nskinparam boundary {\n\t\t\tFontColor #FFF\n\t\tBorderColor #EC7211\n\t\tBackgroundColor #F18E3E-#EC7211\n\tFontColor #4E5D6C\n}\n\nskinparam agent {\n\tBackgroundColor #EC7211\n\tBorderColor #F18E3E\n\tFontColor #4E5D6C\n}\n\nskinparam note {\n\tBorderThickness 1\n\tBackgroundColor #0073bb\n\tBorderColor #005C96\n\tFontColor #FFF\n}\n\nskinparam artifact {\n\tBackgroundColor #4E5D6C\n\tBorderColor #3E4A56\n\tFontColor #abb6c2\n}\n\nskinparam component {\n\t\t\tFontColor #FFF\n\t\tBorderColor #EC7211\n\t\tBackgroundColor #F18E3E-#EC7211\n}\n\nskinparam interface {\n\tBackgroundColor  #A7280E\n\tBorderColor  #d13212\n\tFontColor #4E5D6C\n}\n\nskinparam storage {\n\tBackgroundColor #EC7211\n  \tBorderColor #BD5B0E\n\tFontColor #FFF\n}\n\nskinparam node {\n\tBackgroundColor  transparent\n\tBorderColor #abb6c2\n\tFontColor #abb6c2\n}\n\nskinparam cloud {\n\tBackgroundColor transparent\n\tBorderColor #4E5D6C\n\tFontColor #4E5D6C\n}\n\nskinparam database {\n\t\t\tFontColor #FFF\n\t\tBorderColor #EC7211\n\t\tBackgroundColor #F18E3E-#EC7211\n\tFontColor #4E5D6C\n\tStereotypeFontColor #4E5D6C\n}\n\nskinparam class {\n\t\t\tFontColor #FFF\n\t\tBorderColor #EC7211\n\t\tBackgroundColor #F18E3E-#EC7211\n\tFontColor #FFF\n\tHeaderBackgroundColor #F18E3E-#EC7211\n\tStereotypeFontColor #4E5D6C\n\tBorderThickness 1\n\tAttributeFontColor #FFF\n\tAttributeFontSize 11\n}\n\nskinparam object {\n\t\t\tFontColor #FFF\n\t\tBorderColor #EC7211\n\t\tBackgroundColor #F18E3E-#EC7211\n\tStereotypeFontColor #4E5D6C\n\tBorderThickness 1\n\tAttributeFontColor #FFF\n\tAttributeFontSize 11\n}\n\nskinparam usecase {\n\t\t\tFontColor #FFF\n\t\tBorderColor #EC7211\n\t\tBackgroundColor #F18E3E-#EC7211\n\tBorderThickness 2\n\tStereotypeFontColor #EC7211\n}\n\nskinparam rectangle {\n\tBackgroundColor transparent\n\tFontColor #4E5D6C\n\tBorderColor #4E5D6C\n\tBorderThickness 2\n\tStereotypeFontColor #EC7211\n}\n\nskinparam package {\n\tBackgroundColor transparent\n  \tBorderColor #4E5D6C\n\tFontColor #4E5D6C\n\tBorderThickness 2\n}\n\nskinparam folder {\n\tBackgroundColor #eeeeee\n  \tBorderColor #EC7211\n\tFontColor #EC7211\n\tBorderThickness 2\n}\n\nskinparam frame {\n\tBackgroundColor #eeeeee\n  \tBorderColor #0073bb\n\tFontColor #0073bb\n\tBorderThickness 2\n}\n\nskinparam state {\n\t\t\tFontColor #FFF\n\t\tBorderColor #EC7211\n\t\tBackgroundColor #F18E3E-#EC7211\n\tStartColor #0073bb\n\tEndColor #0073bb\n\tAttributeFontColor #4E5D6C\n\tAttributeFontSize 11\n}\n\nskinparam queue {\n\t\t\tFontColor #FFF\n\t\tBorderColor #EC7211\n\t\tBackgroundColor #F18E3E-#EC7211\n}\n\nskinparam card {\n\tBackgroundColor #0073bb\n\tBorderColor #005C96\n\tFontColor #FFF\n}\n\nskinparam file {\n\tBackgroundColor #eeeeee\n\tBorderColor #abb6c2\n\tFontColor #4E5D6C\n}\n\nskinparam stack {\n\t\t\tFontColor #FFF\n\t\tBorderColor #EC7211\n\t\tBackgroundColor #F18E3E-#EC7211\n}\n\n\nskinparam map {\n\t\t\tFontColor #FFF\n\t\tBorderColor #EC7211\n\t\tBackgroundColor #F18E3E-#EC7211\n}\n\n<style>\nwbsDiagram, mindmapDiagram {\n  root {\n    BackgroundColor transparent\n    FontColor #FFF\n    HyperLinkColor #0073bb\n    LineColor #BD5B0E\n    LineThickness 1\n    Margin 10\n    Padding 6\n    Shadowing 0.0\n  }\n  node {\n    \t\tFontColor #FFF\n\t\tBorderColor #EC7211\n\t\tBackgroundColor #F18E3E-#EC7211\n    Padding 15\n    RoundCorner 20\n  }\n  caption {\n    LineThickness 0\n  }\n  footer {\n    LineThickness 0\n  }\n  groupHeader {\n    BackgroundColor #eeeeee\n    FontColor #0073bb\n    FontStyle bold\n  }\n  header {\n    LineThickness 0\n  }\n  referenceHeader {\n    BackgroundColor transparent\n    FontColor #4E5D6C\n    FontStyle bold\n  }\n  separator {\n    BackgroundColor #4E5D6C\n    FontColor transparent\n    FontStyle bold\n  }\n  title {\n\tFontSize 20\n\tBorderRoundCorner            8\n\tBorderThickness \t         1\n\tBackgroundColor  ffffff-#eeeeee\n\tFontColor #FFF\n\tBorderColor #eeeeee\n  }\n}\nnwdiagDiagram {\n  network {\n    \t\tFontColor #FFF\n\t\tBorderColor #EC7211\n\t\tBackgroundColor #F18E3E-#EC7211    \n    LineColor $PRIMARY_BG\n    LineThickness 1.0\n    FontColor #BD5B0E\n  }\n  server {\n    \t\tFontColor #FFF\n\t\tBorderColor #EC7211\n\t\tBackgroundColor #F18E3E-#EC7211\n  }\n  arrow {\n    FontColor #BD5B0E\n    LineColor #BD5B0E\n  }\n  group {\n    BackGroundColor $LIGHT_BG\n    LineColor #8191A3\n    LineThickness 2.0\n    Margin 5\n    Padding 5\n  }\n}\nganttDiagram {\n  task {\n    \t\tFontColor #FFF\n\t\tBorderColor #EC7211\n\t\tBackgroundColor #F18E3E-#EC7211\n\tLineColor $PRIMARY_BG\n    Margin 10 2 2 2\n    Padding 6\n  }\n  note {\n\tFontColor #FFF\n\tLineColor #005C96\n    BackGroundColor #0073bb\n  }\n  separator {\n\tLineColor #eeeeee\n    BackGroundColor \t\tFontColor #4E5D6C\n\t\tBorderColor #BEBEBE\n\t\tBackgroundColor ffffff-#eeeeee\n    FontColor #4E5D6C\n  }\n  milestone {\n\tFontColor #0073bb\n\tFontSize 16\n\tFontStyle italic\n\tBackGroundColor $DIAMOND_BG\n\tLineColor #BEBEBE\n  }\n  timeline {\n    BackgroundColor #eeeeee\n    FontColor #4E5D6C\n  }\n  closed {\n\tBackgroundColor #BD5B0E\n\tFontColor #FFF\n  }\n}\n</style>\n\nstart\n:Receive renamed parcel;\nif (fresh route?) then (primary)\n  :Validate primary lane;\nelseif (secondary route?) then (secondary)\n  :Validate secondary lane;\nelse (fallback)\n  :Record fallback lane;\nendif\nstop\n@enduml\n"
  steps:
  - Start
  - !Action Receive renamed parcel
  - !If
    condition: fresh route?
    then_label: primary
    source_line: 4
  - !Action Validate primary lane
  - !ElseIf
    condition: secondary route?
    then_label: secondary
    source_line: 6
  - !Action Validate secondary lane
  - !Else fallback
  - !Action Record fallback lane
  - EndIf
  - Stop
