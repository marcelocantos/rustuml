type: Activity
diagram:
  meta:
    skinparams:
    - key: shadowing
      value: 'true'
    style_program:
      declarations:
      - selector:
        - root
        property: shadowing
        value: '3'
        source_line: 2
        epoch: 0
        priority: 0
        origin:
          kind: user_skin_param
    source: |
      @startuml

      skinparam shadowing true
      start
      :Action A;
      if (cond?) then (yes)
        :Yes;
      else (no)
        :No;
      endif
      while (loop?) is (yes)
        :Work;
      endwhile
      stop
      @enduml
  steps:
  - Start
  - !Action Action A
  - !If
    condition: cond?
    then_label: 'yes'
    source_line: 5
  - !Action 'Yes'
  - !Else 'no'
  - !Action 'No'
  - EndIf
  - !While
    condition: loop?
    is_label: 'yes'
    source_line: 10
  - !Action Work
  - !EndWhile null
  - Stop
