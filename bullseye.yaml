    context: 'Created 2026-06-20 from the latest Claude handoff plus Codex follow-up. Starting point: master `93d34d2c` with 72 total golden failures and baseline ledger copied to `/private/tmp/rustuml-baseline-93d34d2c-72.txt`. Claude''s PlantUML instrumentation for `act_elseif3_swim3` established the exact lane-ownership rule for MinMax: a connector draws into lane L iff `tile1.getSwimlaneOut() in {L, null}` and `tile2.getSwimlaneIn() in {L, null}`; `null/null` connectors, especially if-long `ConnectionHline`, draw into every lane; cross-lane non-null/non-null connectors are excluded. Codex WIP in `crates/rustuml-render/src/activity.rs` added connector byte-span metadata plus if-long `(out_lane, in_lane)` tagging and unioned tagged connector x-bounds into swimlane V2 if-mode lane MinMax. It compiles and preserves the simple guard cases, but it is not commit-worthy yet: the three target elseif cases still fail. `RUSTUML_EXT_DBG=1 diff_one act_elseif3_swim3` after the WIP shows Lane1 MinMax moved close to PlantUML (`lane_w=222.789`, target divider width roughly 220.55) while Lane3 becomes over-wide (`lane_w=218.415` before ON_X). More importantly, `route_if_cross_lane_connectors` still bails on branch-to-merge-line polylines (`unmatched src=(57.6089, 174.584) tip=(57.6089, 218.0615)`), because the target is the if-long merge hline rather than a shape anchor. `if_long_vmetrics` also leaves the populated bare-else/merge band about 24 px too tall in the swimlane V2 if-long shape (actual height 281 vs expected 256 for `act_elseif3_swim3`). Next session should either continue from the uncommitted WIP or recreate it, then make the router/vertical merge-band model faithful before committing. Do not release; user explicitly disallowed releases.'
