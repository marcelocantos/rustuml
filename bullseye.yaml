      NEXT FIXES: activity (if/elseif 69, swimlane 51, fork 47, partition 46; nested-switch +0.66px offset from parent if/while branch-entry y); sequence (activation bars, group/alt/opt/loop frames, self-in-group +2px, multiline msgs, autonumber); class (generics ~20, dpi 3, url 5, skinparam padding 5); deployment 102 non-cloud; combo 165 (cross-cutting, cascades); skinparam 212; creole 131 (remaining in_sequence). DEFERRED preproc transparent-bg patch (/tmp/rustuml-patches/DEFERRED-preproc-transparent-bg.patch — correct but needs theme-cascade work to pay off).
