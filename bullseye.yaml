    context: |-
      Shared-SVG round-5 review 50cacfe23 (2026-11-05). Both Macs run macOS 27.2 build 26B123, yet their CoreText coverage differs on 256 scalars across all 13 faces. On Monkey Man the PingFang slots resolve to a downloaded MobileAsset (`AssetsV2/com_apple_MobileAsset_Font8`); on colossus they resolve to the reserved UI copy. Java also uses user fonts: MesloLGS NF and Hack (present on both hosts) are substituted for U+F8B7..F8FE and U+20B7, and a downloaded LiHeiPro supplies U+F880 on Monkey Man. Java reference widths therefore depend on what is installed on the reference host. Census and extraction output: `/Users/marcelo/Library/Caches/rustuml-relay-parent/shared-svg-round5-monkeyman-fontchain/out/` (SHA256SUMS `810633ca…`).

      2026-11-06, from shared-SVG maker round 6 (7e9b16f52), Monkey Man extraction SHA256SUMS `1c345cc3…`: the reference JDK does not use its bundled HarfBuzz 8.2.2. `libfontmanager.dylib` links Homebrew's `libharfbuzz.0.dylib` (compat 61001 = HarfBuzz 10.0.1, Unicode 16.0 UCD). Java text shaping therefore depends on the Homebrew HarfBuzz installed on the reference host, which must be included in the declared and pinned environment. Only the link-time version is known; the loaded version has not been verified.

      2026-11-06, checker diagnostic `shared-svg-round6-monkeyman-hb` (out/SHA256SUMS `c5d00e3c…`, run by the parent on Monkey Man): the reference JVM actually LOADS `/opt/homebrew/Cellar/harfbuzz/15.0.0_1/lib/libharfbuzz.0.dylib` (sha256 `b04ab259…`). Both `DYLD_PRINT_LIBRARIES` and `lsof`/`vmmap` on a live reference JVM confirm it. That is HarfBuzz 15.0.0, not the 10.0.1 the link-time compatibility version implied, and not the bundled 8.2.2. Any `brew upgrade harfbuzz` on Monkey Man therefore silently changes the Java oracle. The pinned environment must include the HarfBuzz keg (and FreeType 2.15.0) and must gate on its hash.

      Review 4689792ca (2026-11-06) found that the oracle itself moved. The Homebrew `opt/harfbuzz` link on Monkey Man switched to 15.0.0_1 on 2026-10-28; 10.1.0 and 13.2.1 are still installed. Relay batches captured before that date were shaped by an older HarfBuzz. HarfBuzz 15.0.0 also brings Unicode 18 data (70 more nonspacing marks; U+180F becomes default-ignorable). All eight relevant font files hash identically on Monkey Man and colossus. The environment record must give the switch date, and any reference that depends on shaping and predates the switch must be marked or re-captured.

      OWNER DECISION 2026-11-06: pin and gate. Declare Monkey Man's current fonts (system, downloaded MobileAsset and user fonts) and the Homebrew HarfBuzz 15.0.0_1 / FreeType 2.15.0 kegs as the oracle in `docs/reference-bootstrap.md`, with hashes. Add a drift gate, and avoid `brew upgrade` on Monkey Man. Merge residual (review faa5f9cb5, K9): the per-face table tests can only pin the committed extraction. A standing check should re-read the face files' advances on the reference host.
