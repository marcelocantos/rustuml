    - 'Skips remain bounded to legitimate categories: Java reference syntax/error pages, ditaa raster diagrams parked under 🎯T2, and true I/O errors. No skips for `%date(...)`, unsupported keywords, or parse failures.'
    context: |-
      Strict-XML golden-pair parity with Java PlantUML via SEMANTIC PORT (licensing 🎯T7).

      PRIMARY MECHANISM: ALGORITHMIC PORTING — port PlantUML's real layout algorithms (FTile activity engine, klimt/compress, sequence/Teoz) into idiomatic Rust; NEVER reverse-engineer per-case constants. Comparator: compare_svg_strict, GEOM_EPS=0.02px, no parking. NOTE: SVG root attrs [style,height,width,viewBox] IGNORED (compare.rs:27) — only element/line/shape coords count.

      STATE (2026-06-18, master 73466632, clean, UNPUSHED ~700 commits ahead of origin): 12,546 total · 98 fail · 1,299 skip. Remaining dominated by swimlane cross-lane (~36, structural) + composites (~37, depend on contained clusters) + act_if{N}while{M}_nesting (10, deep ON_Y) + break-repeat (3, FtileRepeat port).

      PROGRESS: 2026-06-08 session 242→163. 2026-06-14..18 session 163→98 (−65, ALL zero-regression) via fan-out waves 4-12 (workflows/scripts/t4-fanout-wave*.js — 14 opus agents/wave, faithful per-construct, self-gate, commit-and-stop; parent cherry-picks + full-gates + FF). Re-attempting deferred clusters on each improved base keeps cracking them, esp. the ON_Y category via a GATED (not global) compressed-band approach: switch_in_while (gate merge-gap on ≥3 trailing tiles), then if_while_nesting while_ifdepth*+while_nested+while_with_if, switch_in_fork, break (FtileWhile frame_h + FtileIfDown branch-min-width floor + no-is-label frame), repeat-acts (FtileRepeat space/2), elseif, edge while_infinite. Waves intermittently hit the monthly spend limit + transient server rate-limits/stalls — relaunch or resume(resumeFromRunId).

      BIGGEST REMAINING LEVER: the SWIMLANE single-tree rewrite (~36 + ~10 swimlane-dependent composites). RustUML's chronological SEGMENT model (build_swimlanes) chops the step stream at |Lane| markers and can't represent a control-flow container (if/fork/while/group) whose branches switch lanes — open token lands in one segment, close in another → malformed tree (element-count mismatches, not coords). Linear while_simple lanes ARE fixed. PlantUML uses one ftile tree with per-lane x-translate + frame chrome replicated across spanned lane columns (Swimlanes.java). This is a coherent rewrite (build_swimlanes/emit_swimlanes/LaneSegment data model) bounded fan-out agents consistently defer; branch swimlane-single-tree has V2 scaffold + docs/swimlane-rewrite-design.md. Smaller: act_if{N}while{M}_nesting (deep ON_Y), FtileRepeat break-corridor port (act_break_repeat_early/mid, act_repeat_break — merge_cy + trailing-gap + left-corridor-width).

      User directive: NO releases until explicitly told — suppress /release prompts even when /cv recommends one.
    origin: manual
    discovered: 2026-05-17
    achieved: 2026-05-23
