name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Corpus processing instructions and preserved checker records agree on this
  # source revision; see docs/reference-bootstrap.md for provenance and caveats.
  PLANTUML_REVISION: "71806a23780b04a5ccde2f8ceb5121edad5eb711"
  PLANTUML_VERSION: "1.2026.3beta6"
  PLANTUML_STDLIB: ${{ github.workspace }}/reference-stdlib/stdlib

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo build

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Pinned PlantUML standard library
        uses: actions/checkout@v6
        with:
          repository: plantuml/plantuml-stdlib
          ref: 747d1eae809cde20675976d67e3eb84dc0021a0c
          path: reference-stdlib
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: make test

  test-golden:
    name: Parity, Evidence & CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Pinned PlantUML standard library
        uses: actions/checkout@v6
        with:
          repository: plantuml/plantuml-stdlib
          ref: 747d1eae809cde20675976d67e3eb84dc0021a0c
          path: reference-stdlib
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Both parity tiers, harness_guards, doc_claims, parity_perturbations,
      # and pipe_mode. Run all binaries even when one fails; propagate failure.
      - name: Full parity and CLI gate (🎯T14, 🎯T15.3)
        run: make test-parity

  test-oracle:
    name: Oracle Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Pinned PlantUML standard library
        uses: actions/checkout@v6
        with:
          repository: plantuml/plantuml-stdlib
          ref: 747d1eae809cde20675976d67e3eb84dc0021a0c
          path: reference-stdlib
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz fonts-liberation

      - name: Cache PlantUML JAR
        id: cache-plantuml
        uses: actions/cache@v5
        with:
          path: /tmp/plantuml.jar
          key: plantuml-source-${{ env.PLANTUML_REVISION }}-temurin21-${{ runner.os }}

      - name: Pinned PlantUML source
        if: steps.cache-plantuml.outputs.cache-hit != 'true'
        uses: actions/checkout@v6
        with:
          repository: plantuml/plantuml
          ref: ${{ env.PLANTUML_REVISION }}
          path: reference-plantuml

      - name: Build reference JAR
        if: steps.cache-plantuml.outputs.cache-hit != 'true'
        working-directory: reference-plantuml
        run: |
          ./gradlew :build -Pfast --no-daemon --max-workers=3
          cp "build/libs/plantuml-${PLANTUML_VERSION}.jar" /tmp/plantuml.jar

      - name: Record reference environment
        run: |
          sha256sum /tmp/plantuml.jar
          java -Djava.awt.headless=true -jar /tmp/plantuml.jar -version
          dot -V
          fc-match sans-serif

      - name: Start PlantUML server
        run: |
          java -Djava.awt.headless=true -jar /tmp/plantuml.jar -picoweb:8787 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8787/ > /dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8787/ > /dev/null

      - name: Run oracle tests
        env:
          PLANTUML_URL: http://127.0.0.1:8787
          PLANTUML_JAR: /tmp/plantuml.jar
        run: cargo test --test oracle

      - name: Run proptest oracle tests
        env:
          PLANTUML_URL: http://127.0.0.1:8787
        run: cargo test --test proptest_oracle

      - name: Run matrix oracle tests
        env:
          PLANTUML_URL: http://127.0.0.1:8787
        run: cargo test --test matrix_oracle
