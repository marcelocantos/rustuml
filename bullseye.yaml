  T5.1:
    name: Activity if/else cond_* tests pass byte-exact
    status: achieved
    value: 0.0
    cost: 0.0
    acceptance:
    - 'Activity diagram cx accounts for if/else branch-width asymmetry: when `then_w != else_w`, the diagram''s centreline is the midpoint of the two branch centrelines (each at `cx ± (diamond_w + 20)/2`) rather than the geometric centre of the content box. Achieved via new `node_extents() -> (left, right)` and `sequence_extents()`; render() uses `cx = MARGIN_LEAD + content_left`. — commit `4c60f7dc`.'
    - If-branch arrow length uses 10 px diamond-bottom→branch-action and 6 px branch-action→merge-diamond, captured as `IF_BRANCH_DOWN=10` and `IF_BRANCH_UP=6` (not the generic `ARROW_LEN=20`). — commit `3977bdc8`.
