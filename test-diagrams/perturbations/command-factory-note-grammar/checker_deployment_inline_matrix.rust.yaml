    text: tag-only payload
    tags:
    - audit
    - blue-team
    quark_order: 1
    position: Right
    source_line: 2
  - id: DStereo
    text: stereotype-only payload
    stereotype: Ledger
    quark_order: 2
    position: Right
    source_line: 3
  - id: DColor
    text: color-only payload
    color: '#MistyRose'
    quark_order: 3
    position: Right
    source_line: 4
  - id: Deployment.Memo_7
    text: all decorations payload
    color: '#LightBlue'
    tags:
    - audit
    - blue-team
    stereotype: AuditLedger
    quark_order: 4
    position: Right
    source_line: 5
