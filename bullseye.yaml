      METHOD (proven): non-isolated worktrees off the branch tip — `git worktree add -b waveN-<b> /tmp/rwN-<b> strict-xml-wave1` + `ln -s <main>/test-diagrams/golden <wt>/test-diagrams/golden` + spawn agents told to use ONLY absolute paths under their worktree. Zero leaks waves 5-7. Assemble: cherry-pick `strict-xml-wave1..waveN-<b>`, audit for inner_xml/attr-echo, fmt+clippy+lib+full-suite, per-bucket zero-regression check.

