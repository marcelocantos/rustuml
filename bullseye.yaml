  T14.15:
    name: SVG style serialization matches Java for short-hex colours and logical font-family names
    status: converging
    value: 0.0
    cost: 0.0
    acceptance:
    - Colour and font-family serialization are traced to the Java colour-normalization and SVG font-family emitters. No per-diagram or per-attribute special cases.
    - '`color_forms`, `font_family`, and at least two held-out inputs outside the golden corpus match pinned Java whole-output. The held-out inputs cover other short-hex forms and other logical families, in two or more diagram families.'
    - No previously passing no-oracle or standing case is lost.
    context: |-
      On 2026-11-05 the creole parameter maker (production `3d92268c4`) found two whole-output failures in which text metrics and positions were exact but serialized attributes differed:
      - `color_forms`: Rust emits the short form `#123`, where Java emits the expanded `#112233`.
      - `font_family`: Rust emits the Java logical names `Monospaced`/`SansSerif`, where Java emits the CSS names `monospace`/`sans-serif`.

      Both come from the shared colour/font serialization path, which the creole-only packet did not own.

      Update, 2026-11-05: the Rust font-family alias resolver ties attribute naming to metrics. `text_render.rs:760` treats both `monospace` and `Monospaced` as monospace that inherits the surrounding metrics, and the creole monospace flag also picks a metric branch. When the creole parameter maker dropped that flag, six golden cases regressed: `act_creole_monospace` and `creole_font_name_in_{activity,class,note,sequence,title}`. The maker restored the flag for the Courier, monospace and Monospaced aliases only. Java resolves names through `CommandCreoleFontFamilyChange` → `FontConfiguration.changeFamily` → `FontStack.getFonts` / `Font.decode`, and `SvgGraphics.java:697-708` maps `Monospaced` to `monospace`, then converts spaces to NBSP for monospace and Courier. Resolve aliasing once from that source for both serialized names and metrics, with no change to `explicit_font_monospace_inherits_surrounding_metrics` or to the six golden cases.

      Further findings from the independent creole parameter checker (`f6c84a62`, 2026-11-05). Rust's alias normalization trims quotes but not whitespace. Java's `FontStack` trims both whitespace and double quotes before `Font.decode`, while SVG naming and the NBSP substitution use the definition as written, so padded or trailing family names are not yet handled the way Java handles them. Eight-digit colours are Java RRGGBBAA, for example `#8044aa77` serializes as `#8044AA` with opacity `0.46667`. Rust emits the raw value with no opacity. This colour case may move to the creole maker if its parse turns out to live only in `creole.rs`.

      2026-11-05: the colour serialization part (short hex, named/special/transparent/background colours, RRGGBBAA alpha) went to the shared-serialization maker packet, together with 🎯T14.16. Logical font-family naming and the alias/metric coupling are deferred to a later phase.

      Colour `automatic` is not a fixed serializer alias. Java resolves it at draw time: `AtomText.drawU` → `FontConfiguration.adjustColorForBackground(UGraphic)` → `HColorAutomagic.getAppropriateColor(back)` → `HColorSimple.opposite`, using the active or default drawing background. Rust `TextBase` has no drawing-background context. A correct fix needs that context passed to every consumer, sequence included. It is a separate obligation from scalar colour serialization and stays an explicit failure until it is plumbed.
    tags:
    - parity
    - svg
    - style
    - fonts
    origin: manual
    discovered: 2026-11-05
  T14.16:
    name: 'SVG output is always well-formed XML: font-family and other user-derived attributes are escaped as Java does'
    status: converging
    value: 0.0
    cost: 0.0
    acceptance:
    - Every user-derived attribute value in emitted SVG (font-family, href/title/tooltips, ids, class names) is escaped or normalized at a single serialization point, and the Java rule is ported where Java has one (the double-to-single quote replacement in font-family).
    - A standing test parses every golden and perturbation SVG that the CLI emits with a strict XML parser and finds zero malformed outputs.
    - '`font_empty_unknown`, `family_slash` and `alias_monospace_padded` produce well-formed SVG, with no previously passing case lost.'
    context: |-
      On 2026-11-05 the independent creole parameter checker (`f6c84a62`) found that quoted font families, for example `font_empty_unknown`, `family_slash` and `alias_monospace_padded`, make Rust emit malformed SVG XML, both before and after the parameter packet. `text_render` writes the family into an attribute without escaping it, whereas Java replaces double quotes with single quotes. Malformed XML is a correctness failure for every SVG consumer, not just a parity difference.

      2026-11-05: the shared-SVG packet (production `a33dccc8e`) routed 901 user-string attribute sites through one Java-traced escaper (OpenJDK `ToStream.writeAttrString`). It added a two-way-ratcheted strict-XML standing test. The independent checker then found another malformed case. The Java-valid `comment_double_hyphen` input (`class "Double--Tail-"`) produces a malformed Rust XML comment both before and after the packet, because an interpolated comment contains `--` or ends with `-`. The packet's comment inventory lists 45 user-string comment sites. Those still need a source-traced rule: match whatever Java emits for comments, or omit or sanitize user text in comments only if Java does. Separately, four more C0 cases (`href_c0` U+0002, and raw tooltips U+0000/U+0001/U+001B) are malformed Rust output and belong to 🎯T14.20.

      Oracle weakness found by the independent shared-SVG checker (`astra`, 2026-11-05): the strict-XML standing test in `pipe_mode.rs` finds the DOCTYPE with `svg.find("<!DOCTYPE")`. An XML comment placed before the real DOCTYPE and containing the exact approved SVG 1.1 DOCTYPE text satisfies that guard as a decoy. `allow_dtd: true` then parses a later, unapproved internal-entity DTD, and the 26-count guard still passes. Fix: identify the actual DOCTYPE token positionally (the first markup declaration in the prolog, after the XML declaration), require its exact approved bytes, and reject any internal subset (`[`). Add the comment-decoy mutation as a standing negative test of the oracle itself.

