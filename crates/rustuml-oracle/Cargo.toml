[package]
name = "rustuml-oracle"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
format-tests = []

[dependencies]
anyhow = "1"
libc = "0.2"
roxmltree = "0.20"
rustuml-render = { path = "../rustuml-render", features = ["oracle-layout"] }
rustuml-layout = { path = "../rustuml-layout", features = ["diagnostics"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
wait-timeout = "0.2"

[dev-dependencies]
proptest = "1"
rayon = "1"
num_cpus = "1"
rustuml-parser = { path = "../rustuml-parser" }
