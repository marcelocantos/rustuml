[package]
name = "rustuml-render"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Development-only layout injection used by rustuml-oracle diff tooling.
oracle-layout = []

[dependencies]
ab_glyph = "0.2"
flate2 = { version = "1", default-features = false, features = ["zlib"] }
libz-sys = { version = "1.1.20", default-features = false, features = ["static"] }
png = "0.18"
regex = "1"
rustuml-layout = { path = "../rustuml-layout" }
rustuml-math = { path = "../rustuml-math" }
rustuml-parser = { path = "../rustuml-parser" }
serde = { version = "1", features = ["derive"] }
serde_yml = "0.0.12"
resvg = "0.47"
svg2pdf = "0.13"
